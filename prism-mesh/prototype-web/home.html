<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PrismMesh - 首页</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    /* ===== 仪表盘增强样式 ===== */

    /* 欢迎区域 */
    .welcome-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: var(--space-5);
    }
    .welcome-row .page-title {
      margin-bottom: 0;
    }
    .welcome-date {
      font-size: var(--text-sm);
      color: var(--text-muted);
      white-space: nowrap;
      padding-bottom: 2px;
    }
    .welcome-greeting {
      font-size: var(--text-sm);
      color: var(--text-sub);
      margin-top: var(--space-1);
      font-weight: var(--font-weight-normal);
    }

    /* 统计卡片增强 */
    .stat-card .stat-accent-blue {
      background: linear-gradient(90deg, var(--primary-500), var(--primary-300));
    }
    .stat-card .stat-accent-green {
      background: linear-gradient(90deg, var(--success), #34D399);
    }
    .stat-card .stat-accent-yellow {
      background: linear-gradient(90deg, var(--warning), #FBBF24);
    }
    .stat-card .stat-accent-purple {
      background: linear-gradient(90deg, #8B5CF6, #A78BFA);
    }
    .stat-card .stat-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-1);
    }

    /* 快捷操作区域 */
    .quick-card {
      position: relative;
      overflow: hidden;
    }
    .quick-card .qc-icon-bg {
      position: absolute;
      right: -12px;
      bottom: -12px;
      font-size: 56px;
      opacity: 0.06;
      line-height: 1;
      pointer-events: none;
    }

    /* 活动筛选按钮组 */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-4);
    }

    /* 活动列表项目 */
    .activity-item {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-2);
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition-fast);
      cursor: pointer;
    }
    .activity-item:last-child {
      border-bottom: none;
    }
    .activity-item:hover {
      background: var(--surface-hover);
    }
    .activity-item .ai-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .activity-item .ai-content {
      flex: 1;
      min-width: 0;
    }
    .activity-item .ai-title {
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .activity-item .ai-desc {
      font-size: var(--text-sm);
      color: var(--text-sub);
      margin-top: 2px;
    }
    .activity-item .ai-meta {
      text-align: right;
      flex-shrink: 0;
    }
    .activity-item .ai-time {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .activity-item .ai-cost {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* 模型图标颜色 */
    .icon-gpt { background: #DBEAFE; color: #1E40AF; }
    .icon-claude { background: #EDE9FE; color: #7C3AED; }
    .icon-gemini { background: #FEF3C7; color: #D97706; }
    .icon-llama { background: #D1FAE5; color: #059669; }
    .icon-qwen { background: #FCE7F3; color: #DB2777; }
    .icon-embedding { background: #E0F2FE; color: #0284C7; }
    .icon-vision { background: #F0F9FF; color: #0369A1; }
    .icon-code { background: #F5F3FF; color: #6D28D9; }
    .icon-deepseek { background: #ECFDF5; color: #047857; }

    /* 底部统计小卡片 */
    .mini-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
    }
    .mini-stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-4);
      text-align: center;
      transition: all var(--transition-fast);
    }
    .mini-stat-card:hover {
      border-color: var(--primary-200);
      box-shadow: var(--shadow-sm);
    }
    .mini-stat-card .ms-value {
      font-size: var(--text-lg);
      font-weight: var(--font-weight-bold);
      color: var(--text);
      line-height: var(--leading-tight);
    }
    .mini-stat-card .ms-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-1);
    }

    /* 空状态 */
    .empty-filter {
      text-align: center;
      padding: var(--space-10) var(--space-4);
      color: var(--text-muted);
    }
    .empty-filter .ef-icon {
      font-size: 36px;
      margin-bottom: var(--space-3);
      opacity: 0.3;
    }
    .empty-filter .ef-text {
      font-size: var(--text-sm);
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .welcome-row {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-1);
      }
      .mini-stat-grid {
        grid-template-columns: 1fr;
      }
      .filter-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
      }
      .quick-grid {
        grid-template-columns: 1fr;
      }
      .activity-item {
        padding: var(--space-3) var(--space-1);
      }
      .stat-grid {
        gap: var(--space-3);
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="app-header">
    <div class="brand" onclick="goTo('home.html')">
      <span class="logo-icon">P</span>
      <span class="brand-name"><span class="highlight">Prism</span>Mesh</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:var(--space-2);">
      <button class="btn btn-sm btn-primary-ghost" onclick="openAuthModal()">登录</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" title="切换主题">🌓</button>
      <span style="font-size:var(--text-sm);color:var(--text-sub);" id="user-name-display">用户</span>
      <div class="avatar" onclick="goTo('me.html')" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary-600),var(--primary-500));color:white;display:flex;align-items:center;justify-content:center;font-size:var(--text-sm);font-weight:var(--font-weight-semibold);cursor:pointer;box-shadow:0 2px 4px rgba(30,64,175,0.2);" id="user-avatar-display">P</div>
    </div>
  </header>

  <div class="page">
    <!-- 欢迎区域 -->
    <div class="welcome-row">
      <div>
        <h1 class="page-title" id="welcome-title">欢迎回来 👋</h1>
        <div class="welcome-greeting" id="welcome-greeting">这是您的 PrismMesh 平台概览</div>
      </div>
      <div class="welcome-date" id="welcome-date"></div>
    </div>

    <!-- 统计卡片 -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-accent stat-accent-blue"></div>
        <div class="stat-icon">📡</div>
        <div class="stat-value" id="stat-calls">12,458</div>
        <div class="stat-label">今日 API 调用</div>
        <div class="stat-change up">↑ 12.5% 较昨日</div>
      </div>
      <div class="stat-card">
        <div class="stat-accent stat-accent-green"></div>
        <div class="stat-icon">🧠</div>
        <div class="stat-value">86</div>
        <div class="stat-label">可用模型</div>
        <div class="stat-change up">+3 本周新增</div>
      </div>
      <div class="stat-card">
        <div class="stat-accent stat-accent-yellow"></div>
        <div class="stat-icon">💰</div>
        <div class="stat-value" id="stat-spend">¥32.50</div>
        <div class="stat-label">今日消费</div>
        <div class="stat-change down">余额充足</div>
      </div>
      <div class="stat-card">
        <div class="stat-accent stat-accent-purple"></div>
        <div class="stat-icon">🔑</div>
        <div class="stat-value">4</div>
        <div class="stat-label">活跃 API Key</div>
        <div class="stat-change up">2 个即将到期</div>
      </div>
    </div>

    <!-- 快捷操作 -->
    <div class="section-header">
      <h2 class="section-title">快捷操作</h2>
    </div>
    <div class="quick-grid">
      <div class="quick-card" onclick="goTo('playground.html')">
        <div class="qc-icon">🧪</div>
        <div class="qc-label">在线测试</div>
        <div class="qc-icon-bg">🧪</div>
      </div>
      <div class="quick-card" onclick="goTo('keys.html')">
        <div class="qc-icon">🔑</div>
        <div class="qc-label">创建 API Key</div>
        <div class="qc-icon-bg">🔑</div>
      </div>
      <div class="quick-card" onclick="goTo('docs.html')">
        <div class="qc-icon">📖</div>
        <div class="qc-label">接入文档</div>
        <div class="qc-icon-bg">📖</div>
      </div>
    </div>

    <!-- 近期调用卡片 -->
    <div class="card" style="padding:var(--space-5);">
      <div class="card-header">
        <span class="card-title">近期调用</span>
        <button class="btn btn-sm btn-primary-ghost" onclick="showToast('即将跳转至完整统计页','info')">查看全部 →</button>
      </div>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="btn-group">
          <button class="btn btn-sm active" data-filter="all" onclick="filterActivity('all',this)">全部</button>
          <button class="btn btn-sm" data-filter="success" onclick="filterActivity('success',this)">成功</button>
          <button class="btn btn-sm" data-filter="failed" onclick="filterActivity('failed',this)">失败</button>
        </div>
      </div>

      <!-- 活动列表 -->
      <div id="activity-list"></div>

      <!-- 空状态 -->
      <div id="empty-filter" class="empty-filter" style="display:none;">
        <div class="ef-icon">🔍</div>
        <div class="ef-text">当前筛选条件下没有记录</div>
      </div>
    </div>

    <!-- 底部快速统计 -->
    <div class="section-header" style="margin-top:var(--space-2);">
      <h2 class="section-title">数据概览</h2>
    </div>
    <div class="mini-stat-grid">
      <div class="mini-stat-card">
        <div class="ms-value">284.6K</div>
        <div class="ms-label">总调用次数</div>
      </div>
      <div class="mini-stat-card">
        <div class="ms-value">18.2M</div>
        <div class="ms-label">总 Token 消耗</div>
      </div>
      <div class="mini-stat-card">
        <div class="ms-value" id="stat-balance">¥267.40</div>
        <div class="ms-label">账户余额</div>
      </div>
    </div>
  </div>

  <!-- 底部 Tab 导航 -->
  <nav class="tab-bar">
    <button class="tab-item active" onclick="goTo('home.html')">
      <span class="tab-icon">🏠</span> 首页
    </button>
    <button class="tab-item" onclick="goTo('models.html')">
      <span class="tab-icon">🧠</span> 模型
    </button>
    <button class="tab-item" onclick="goTo('stats.html')">
      <span class="tab-icon">📊</span> 统计
    </button>
    <button class="tab-item" onclick="goTo('me.html')">
      <span class="tab-icon">👤</span> 我的
    </button>
  </nav>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/login-modal.js"></script>
  <script>
    // ===== 页面初始化 =====
    document.addEventListener('DOMContentLoaded', function () {
      if (!checkAuth()) return;

      // 加载用户信息
      var user = getUser();
      if (user) {
        var name = user.name || user.email || '用户';
        document.getElementById('user-name-display').textContent = name;
        document.getElementById('user-avatar-display').textContent = name.charAt(0).toUpperCase();
      }

      // 动态问候语与时间
      var now = new Date();
      var hour = now.getHours();
      var greeting = '';
      if (hour < 6) greeting = '夜深了';
      else if (hour < 9) greeting = '早上好';
      else if (hour < 12) greeting = '上午好';
      else if (hour < 14) greeting = '中午好';
      else if (hour < 18) greeting = '下午好';
      else greeting = '晚上好';

      var userName = (user && (user.name || user.email)) || '用户';
      document.getElementById('welcome-title').textContent = greeting + '，' + userName + ' 👋';
      document.getElementById('welcome-greeting').textContent = '这是您的 PrismMesh 平台概览';

      var dateStr = now.getFullYear() + '年' +
        String(now.getMonth() + 1).padStart(2, '0') + '月' +
        String(now.getDate()).padStart(2, '0') + '日 · ' +
        '星期' + ['日','一','二','三','四','五','六'][now.getDay()];
      document.getElementById('welcome-date').textContent = dateStr;

      // 渲染活动列表
      renderActivities('all');
    });

    // ===== 示例活动数据 =====
    var activityData = [
      { id: 1, model: 'GPT-4o', icon: 'GPT', status: 'success', tokens: 1256, cost: 0.032, time: Date.now() - 60 * 1000, desc: 'Chat Completions' },
      { id: 2, model: 'Claude 3.5 Sonnet', icon: 'CLAUDE', status: 'success', tokens: 843, cost: 0.018, time: Date.now() - 5 * 60 * 1000, desc: 'Chat Completions' },
      { id: 3, model: 'DeepSeek-V2', icon: 'DEEPSEEK', status: 'success', tokens: 1678, cost: 0.025, time: Date.now() - 10 * 60 * 1000, desc: 'Chat Completions' },
      { id: 4, model: 'Qwen2-72B', icon: 'QWEN', status: 'failed', tokens: 0, cost: 0, time: Date.now() - 18 * 60 * 1000, desc: '请求超时 - 上下文过长' },
      { id: 5, model: 'text-embedding-3', icon: 'EMBEDDING', status: 'success', tokens: 2048, cost: 0.004, time: Date.now() - 30 * 60 * 1000, desc: 'Embeddings' },
      { id: 6, model: 'Llama 3.1 405B', icon: 'LLAMA', status: 'success', tokens: 2156, cost: 0.048, time: Date.now() - 50 * 60 * 1000, desc: 'Chat Completions' },
      { id: 7, model: 'Gemini 1.5 Pro', icon: 'GEMINI', status: 'success', tokens: 892, cost: 0.022, time: Date.now() - 70 * 60 * 1000, desc: 'Vision Analysis' },
      { id: 8, model: 'CodeGemma 7B', icon: 'CODE', status: 'failed', tokens: 0, cost: 0, time: Date.now() - 100 * 60 * 1000, desc: '认证失败 - Key 已过期' }
    ];

    function renderActivities(filter) {
      var container = document.getElementById('activity-list');
      var emptyEl = document.getElementById('empty-filter');

      var filtered = filter === 'all'
        ? activityData
        : activityData.filter(function (item) { return item.status === filter; });

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var item = filtered[i];
        var iconClass = getIconClass(item.icon);
        var statusBadge = item.status === 'success'
          ? '<span class="badge badge-green">成功</span>'
          : '<span class="badge badge-red">失败</span>';
        var timeStr = formatRelativeTime(item.time);
        var costText = item.cost > 0 ? formatCurrency(item.cost) : '-';

        html +=
          '<div class="activity-item">' +
            '<div class="ai-icon ' + iconClass + '">' + getModelEmoji(item.icon) + '</div>' +
            '<div class="ai-content">' +
              '<div class="ai-title">' + item.model + '</div>' +
              '<div class="ai-desc">' + item.desc + ' · ' + item.tokens + ' tokens</div>' +
            '</div>' +
            '<div class="ai-meta">' +
              '<div class="ai-time">' + timeStr + '</div>' +
              statusBadge +
              '<div class="ai-cost">' + costText + '</div>' +
            '</div>' +
          '</div>';
      }
      container.innerHTML = html;
    }

    function filterActivity(filter, btn) {
      var btns = document.querySelectorAll('.btn-group .btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      btn.classList.add('active');
      renderActivities(filter);
    }

    function getIconClass(key) {
      var map = {
        'GPT': 'icon-gpt',
        'CLAUDE': 'icon-claude',
        'GEMINI': 'icon-gemini',
        'LLAMA': 'icon-llama',
        'QWEN': 'icon-qwen',
        'EMBEDDING': 'icon-embedding',
        'VISION': 'icon-vision',
        'CODE': 'icon-code',
        'DEEPSEEK': 'icon-deepseek'
      };
      return map[key] || 'icon-gpt';
    }

    function getModelEmoji(key) {
      var map = {
        'GPT': '🤖',
        'CLAUDE': '🌙',
        'GEMINI': '✨',
        'LLAMA': '🦙',
        'QWEN': '🐉',
        'EMBEDDING': '🔤',
        'VISION': '👁',
        'CODE': '💻',
        'DEEPSEEK': '🌊'
      };
      return map[key] || '🧠';
    }

    function formatRelativeTime(timestamp) {
      var diff = Date.now() - timestamp;
      var minutes = Math.floor(diff / 60000);
      if (minutes < 1) return '刚刚';
      if (minutes < 60) return minutes + ' 分钟前';
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + ' 小时前';
      var days = Math.floor(hours / 24);
      return days + ' 天前';
    }
  </script>
</body>
</html>
