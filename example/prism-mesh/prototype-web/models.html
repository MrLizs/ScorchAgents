<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PrismMesh - 模型广场</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    /* 模型广场专用样式 */

    /* 页面 header 加内边距调整（因为标题在 page 内） */
    .models-page {
      padding-top: calc(var(--header-height) + var(--spacing-md));
      padding-bottom: calc(var(--tab-height) + var(--spacing-md));
      max-width: var(--max-width);
      margin: 0 auto;
      padding-left: var(--spacing-md);
      padding-right: var(--spacing-md);
    }

    /* 分类过滤按钮组 */
    .category-filter {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
      overflow-x: auto;
      padding-bottom: var(--spacing-xs);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .category-filter::-webkit-scrollbar { display: none; }
    .category-filter .cat-btn {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
    }
    .category-filter .cat-btn:hover {
      border-color: var(--primary-light);
      color: var(--primary);
      background: var(--primary-soft);
    }
    .category-filter .cat-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* 模型卡片网格 */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-md);
    }

    /* 模型卡片增强 */
    .model-card {
      position: relative;
      display: flex;
      flex-direction: column;
      transition: all 0.25s;
    }
    .model-card:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .model-card .model-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
    }
    .model-card .model-provider-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .model-card .model-info {
      flex: 1;
      min-width: 0;
    }
    .model-card .model-body {
      flex: 1;
    }
    .model-card .model-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
      margin-top: var(--spacing-sm);
    }
    .model-card .model-tags .tag {
      font-size: 11px;
      padding: 1px 8px;
    }

    /* 模型状态标签颜色变体 */
    .status-stable { background: var(--success-soft); color: var(--success); }
    .status-new { background: var(--primary-soft); color: var(--primary); }
    .status-hot { background: #FEF3C7; color: #D97706; }

    /* 提供商图标颜色 */
    .provider-openai { background: #DBEAFE; color: #1E40AF; }
    .provider-anthropic { background: #EDE9FE; color: #7C3AED; }
    .provider-google { background: #FEF3C7; color: #D97706; }
    .provider-meta { background: #D1FAE5; color: #059669; }
    .provider-alibaba { background: #FCE7F3; color: #DB2777; }
    .provider-deepseek { background: #E0F2FE; color: #0284C7; }
    .provider-mistral { background: #F0F9FF; color: #0369A1; }
    .provider-stability { background: #F5F3FF; color: #6D28D9; }
    .provider-bytedance { background: #ECFDF5; color: #047857; }
    .provider-baidu { background: #FFF7ED; color: #C2410C; }

    /* 空搜索结果 */
    .no-results {
      display: none;
      text-align: center;
      padding: var(--spacing-2xl) var(--spacing-md);
      color: var(--text-muted);
    }
    .no-results .nr-icon { font-size: 48px; margin-bottom: var(--spacing-md); opacity: 0.3; }
    .no-results .nr-text { font-size: var(--font-size-md); }

    /* 响应式 */
    @media (max-width: 480px) {
      .model-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="app-header">
    <div class="brand" onclick="goTo('home.html')" style="cursor:pointer;">
      <span class="logo-icon">P</span>
      <span>PrismMesh</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:var(--spacing-sm);">
      <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" title="切换主题" style="color:var(--text-sub);font-size:16px;">🌓</button>
      <span style="font-size:var(--font-size-sm);color:var(--text-sub);" id="user-name-display">用户</span>
      <div class="avatar" onclick="goTo('me.html')" style="width:32px;height:32px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:var(--font-size-sm);cursor:pointer;font-weight:var(--font-weight-semibold);" id="user-avatar-display">P</div>
    </div>
  </header>

  <div class="models-page">
    <!-- 页面标题 -->
    <div class="page-title">模型广场</div>

    <!-- 搜索框 -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="model-search" placeholder="搜索模型名称或提供商..." oninput="filterModels()">
    </div>

    <!-- 分类过滤 -->
    <div class="category-filter" id="category-filter">
      <button class="cat-btn active" data-cat="all" onclick="filterCategory('all',this)">全部</button>
      <button class="cat-btn" data-cat="chat" onclick="filterCategory('chat',this)">💬 对话</button>
      <button class="cat-btn" data-cat="image" onclick="filterCategory('image',this)">🎨 图像</button>
      <button class="cat-btn" data-cat="code" onclick="filterCategory('code',this)">💻 代码</button>
      <button class="cat-btn" data-cat="audio" onclick="filterCategory('audio',this)">🎵 音频</button>
      <button class="cat-btn" data-cat="video" onclick="filterCategory('video',this)">🎬 视频</button>
      <button class="cat-btn" data-cat="embedding" onclick="filterCategory('embedding',this)">🔤 嵌入</button>
    </div>

    <!-- 模型网格容器 -->
    <div class="model-grid" id="model-grid"></div>

    <!-- 无结果 -->
    <div class="no-results" id="no-results">
      <div class="nr-icon">🔍</div>
      <div class="nr-text">没有找到匹配的模型</div>
    </div>
  </div>

  <!-- 底部 Tab 导航 -->
  <nav class="tab-bar">
    <button class="tab-item" data-href="home.html" onclick="goTo('home.html')">
      <span class="tab-icon">🏠</span> 首页
    </button>
    <button class="tab-item active" data-href="models.html" onclick="goTo('models.html')">
      <span class="tab-icon">🧠</span> 模型
    </button>
    <button class="tab-item" data-href="stats.html" onclick="goTo('stats.html')">
      <span class="tab-icon">📊</span> 统计
    </button>
    <button class="tab-item" data-href="me.html" onclick="goTo('me.html')">
      <span class="tab-icon">👤</span> 我的
    </button>
  </nav>

  <script src="assets/js/common.js"></script>
  <script>
    // ===== 模型数据 =====
    var modelsData = [
      {
        id: 'gpt-4o',
        name: 'GPT-4o',
        provider: 'OpenAI',
        providerKey: 'openai',
        emoji: '🤖',
        desc: '多模态旗舰模型，支持文本、图像、音频理解与生成，性能与速度的完美平衡。',
        category: 'chat',
        tags: ['对话', '图像', '音频'],
        status: 'hot',
        statusLabel: '热门',
        priceInput: '¥2.50 / 1M tokens',
        priceOutput: '¥10.00 / 1M tokens',
      },
      {
        id: 'claude-3.5-sonnet',
        name: 'Claude 3.5 Sonnet',
        provider: 'Anthropic',
        providerKey: 'anthropic',
        emoji: '🌙',
        desc: '擅长长文本理解与复杂推理，代码生成与对话质量业界领先。',
        category: 'chat',
        tags: ['对话', '代码'],
        status: 'stable',
        statusLabel: '稳定',
        priceInput: '¥2.00 / 1M tokens',
        priceOutput: '¥8.00 / 1M tokens',
      },
      {
        id: 'deepseek-v3',
        name: 'DeepSeek V3',
        provider: 'DeepSeek',
        providerKey: 'deepseek',
        emoji: '🌊',
        desc: '高性能开源 MoE 模型，671B 参数，推理成本极低，中文能力出众。',
        category: 'chat',
        tags: ['对话', '代码'],
        status: 'hot',
        statusLabel: '热门',
        priceInput: '¥0.50 / 1M tokens',
        priceOutput: '¥2.00 / 1M tokens',
      },
      {
        id: 'qwen2.5-72b',
        name: 'Qwen2.5 72B',
        provider: 'Alibaba Cloud',
        providerKey: 'alibaba',
        emoji: '🐉',
        desc: '通义千问最新版本，72B 参数，多语言能力强劲，中文理解表现卓越。',
        category: 'chat',
        tags: ['对话', '代码'],
        status: 'stable',
        statusLabel: '稳定',
        priceInput: '¥1.00 / 1M tokens',
        priceOutput: '¥3.50 / 1M tokens',
      },
      {
        id: 'stable-diffusion-3',
        name: 'Stable Diffusion 3',
        provider: 'Stability AI',
        providerKey: 'stability',
        emoji: '🎨',
        desc: '最新文生图模型，支持高质量图像生成与编辑，文字渲染能力大幅提升。',
        category: 'image',
        tags: ['图像生成', '图像编辑'],
        status: 'stable',
        statusLabel: '稳定',
        priceInput: '¥0.80 / 张',
        priceOutput: '1024×1024',
      },
      {
        id: 'gemini-1.5-pro',
        name: 'Gemini 1.5 Pro',
        provider: 'Google',
        providerKey: 'google',
        emoji: '✨',
        desc: '超长上下文窗口（100万 tokens），支持多模态输入，视频理解能力突出。',
        category: 'chat',
        tags: ['对话', '视频', '音频'],
        status: 'stable',
        statusLabel: '稳定',
        priceInput: '¥2.50 / 1M tokens',
        priceOutput: '¥7.50 / 1M tokens',
      },
      {
        id: 'llama-3.1-405b',
        name: 'Llama 3.1 405B',
        provider: 'Meta',
        providerKey: 'meta',
        emoji: '🦙',
        desc: '最大开源模型，405B 参数，推理、数学、工具调用能力接近闭源模型。',
        category: 'chat',
        tags: ['对话', '代码', '推理'],
        status: 'new',
        statusLabel: '新上线',
        priceInput: '¥2.00 / 1M tokens',
        priceOutput: '¥6.00 / 1M tokens',
      },
      {
        id: 'mistral-large',
        name: 'Mistral Large',
        provider: 'Mistral AI',
        providerKey: 'mistral',
        emoji: '🌪',
        desc: '欧洲领先的 AI 模型，多语言能力强，函数调用与 RAG 场景表现优异。',
        category: 'chat',
        tags: ['对话', '代码'],
        status: 'stable',
        statusLabel: '稳定',
        priceInput: '¥1.60 / 1M tokens',
        priceOutput: '¥5.00 / 1M tokens',
      },
      {
        id: 'text-embedding-3',
        name: 'text-embedding-3',
        provider: 'OpenAI',
        providerKey: 'openai',
        emoji: '🔤',
        desc: '新一代文本嵌入模型，支持 256/1024/3072 维输出，语义搜索与聚类首选。',
        category: 'embedding',
        tags: ['文本嵌入', '语义搜索'],
        status: 'stable',
        statusLabel: '稳定',
        priceInput: '¥0.20 / 1M tokens',
        priceOutput: '-',
      },
      {
        id: 'doubao-pro',
        name: 'Doubao Pro',
        provider: 'ByteDance',
        providerKey: 'bytedance',
        emoji: '🍀',
        desc: '字节跳动旗舰对话模型，中文创作与知识问答能力突出，响应速度快。',
        category: 'chat',
        tags: ['对话', '创作'],
        status: 'new',
        statusLabel: '新上线',
        priceInput: '¥0.80 / 1M tokens',
        priceOutput: '¥2.50 / 1M tokens',
      },
    ];

    // ===== 当前状态 =====
    var currentCategory = 'all';
    var currentKeyword = '';

    // ===== 渲染模型卡片 =====
    function renderModels() {
      var grid = document.getElementById('model-grid');
      var noResults = document.getElementById('no-results');

      var filtered = modelsData.filter(function (m) {
        // 分类过滤
        if (currentCategory !== 'all' && m.category !== currentCategory) return false;
        // 关键词搜索
        if (currentKeyword) {
          var kw = currentKeyword.toLowerCase();
          var matchName = m.name.toLowerCase().indexOf(kw) !== -1;
          var matchProvider = m.provider.toLowerCase().indexOf(kw) !== -1;
          var matchDesc = m.desc.toLowerCase().indexOf(kw) !== -1;
          if (!matchName && !matchProvider && !matchDesc) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var m = filtered[i];

        // 状态 badge 样式
        var statusClass = '';
        if (m.status === 'hot') statusClass = 'status-hot';
        else if (m.status === 'new') statusClass = 'status-new';
        else statusClass = 'status-stable';

        // 标签
        var tagsHtml = '';
        for (var t = 0; t < m.tags.length; t++) {
          tagsHtml += '<span class="tag">' + m.tags[t] + '</span>';
        }

        html +=
          '<div class="model-card" onclick="goTo(\'playground.html?model=' + m.id + '\')">' +
            '<div class="model-header">' +
              '<div class="model-provider-icon provider-' + m.providerKey + '">' + m.emoji + '</div>' +
              '<div class="model-info">' +
                '<div class="model-name">' + m.name + '</div>' +
                '<div class="model-provider">' + m.provider + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="model-body">' +
              '<div class="model-desc">' + m.desc + '</div>' +
              '<div class="model-tags">' + tagsHtml + '</div>' +
            '</div>' +
            '<div class="model-footer">' +
              '<div class="model-price">' +
                '输入 ' + m.priceInput +
                '<br>' +
                '输出 ' + m.priceOutput +
              '</div>' +
              '<span class="model-status ' + statusClass + '">' + m.statusLabel + '</span>' +
            '</div>' +
          '</div>';
      }
      grid.innerHTML = html;
    }

    // ===== 分类过滤 =====
    function filterCategory(cat, btn) {
      currentCategory = cat;
      var btns = document.querySelectorAll('.cat-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      btn.classList.add('active');
      renderModels();
    }

    // ===== 关键词搜索 =====
    function filterModels() {
      currentKeyword = document.getElementById('model-search').value.trim();
      renderModels();
    }

    // ===== 页面初始化 =====
    document.addEventListener('DOMContentLoaded', function () {
      if (!checkAuth()) return;
      var user = getUser();
      if (user) {
        document.getElementById('user-name-display').textContent = user.name || user.email;
        document.getElementById('user-avatar-display').textContent = (user.name || user.email || 'P').charAt(0).toUpperCase();
      }
      renderModels();
    });
  </script>
</body>
</html>
