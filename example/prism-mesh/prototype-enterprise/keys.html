<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Key 管理 - PrismMesh 企业后台</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/admin.css">
<style>
  /* Key 管理页局部样式 */
  .model-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .model-chip-tag { padding: 1px 8px; border-radius: var(--radius-full); background: var(--gray-100); color: var(--gray-600); font-size: var(--text-xs); white-space: nowrap; }
  .model-chip-tag.more { background: var(--primary-50); color: var(--primary); }

  .full-key-box {
    background: var(--gray-900); color: #E2E8F0;
    font-family: var(--font-mono); font-size: var(--text-sm);
    padding: var(--space-3); border-radius: var(--radius);
    word-break: break-all; user-select: all; position: relative;
    margin-bottom: var(--space-3);
  }

  .perm-select { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: var(--text-base); cursor: pointer; outline: none; }
  .perm-select:focus { border-color: var(--primary-500); box-shadow: 0 0 0 3px var(--primary-100); }

  .create-model-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); max-height: 180px; overflow-y: auto; padding-right: 4px; }
  .create-model-item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); border: 1.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: var(--text-sm); color: var(--text); transition: all var(--transition-fast); user-select: none; }
  .create-model-item:hover { border-color: var(--primary-300); }
  .create-model-item.checked { border-color: var(--primary); background: var(--primary-50); color: var(--primary-700); }
  .create-model-item input { accent-color: var(--primary); cursor: pointer; }

  .key-detail-link { color: var(--primary); cursor: pointer; font-weight: var(--font-weight-medium); }
  .key-detail-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- ============ 侧边栏 ============ -->
<aside class="admin-sidebar" id="ent-sidebar">
  <div class="sidebar-brand">
    <span class="logo-icon">E</span>
    <span class="brand-name"><span class="highlight">Prism</span>Mesh</span>
  </div>
  <div class="sidebar-nav">
    <div class="sidebar-section-label">总览</div>
    <button class="nav-item" data-page="overview.html" onclick="goTo('overview.html')"><span class="nav-icon">📊</span>企业概览</button>
    <div class="sidebar-section-label">管理</div>
    <button class="nav-item" data-page="keys.html" onclick="goTo('keys.html')"><span class="nav-icon">🔑</span>API Key 管理</button>
    <button class="nav-item" data-page="dialogues.html" onclick="goTo('dialogues.html')"><span class="nav-icon">💬</span>对话审计</button>
    <div class="sidebar-section-label">分析</div>
    <button class="nav-item" data-page="usage.html" onclick="goTo('usage.html')"><span class="nav-icon">📈</span>用量统计</button>
    <button class="nav-item" data-page="audit.html" onclick="goTo('audit.html')"><span class="nav-icon">🕐</span>调用审计</button>
    <div class="sidebar-section-label">企业</div>
    <button class="nav-item" data-page="members.html" onclick="goTo('members.html')"><span class="nav-icon">👥</span>成员管理</button>
    <button class="nav-item" data-page="settings.html" onclick="goTo('settings.html')"><span class="nav-icon">⚙️</span>企业设置</button>
  </div>
  <div class="sidebar-footer">
    <div class="admin-info">
      <span class="avatar" id="ent-avatar">E</span>
      <div>
        <div id="ent-org-name" style="font-weight:var(--font-weight-semibold);color:#fff;font-size:var(--text-sm);">企业名称</div>
        <div id="ent-user-name" style="font-size:var(--text-xs);color:rgba(255,255,255,0.5);">管理员</div>
      </div>
    </div>
    <button class="logout-btn" onclick="entLogout()">🚪 退出登录</button>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- ============ 顶栏 ============ -->
<header class="admin-header">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <h1 class="header-title">API Key 管理</h1>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="goTo('../prototype-web/index.html')">🌐 用户端</button>
  </div>
</header>

<!-- ============ 内容区 ============ -->
<main class="admin-main">
  <div class="admin-content">

    <div class="page-header">
      <div>
        <h2 class="page-title">API Key 管理</h2>
        <p class="page-subtitle">管理企业全部 API Key，点击 Key 名称查看该 Key 调用了哪些模型、次数与 Token</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openCreateModal()">+ 新建 Key</button>
      </div>
    </div>

    <!-- 提示条 -->
    <div class="card" style="background:var(--primary-50);border-color:var(--primary-200);padding:var(--space-4);">
      <div style="display:flex;gap:var(--space-3);align-items:center;">
        <span style="font-size:var(--text-lg);">🔐</span>
        <div>
          <b style="font-size:var(--text-sm);color:var(--primary-800);">API Key 是您企业的秘密凭证，请妥善保管</b>
          <div style="font-size:var(--text-xs);color:var(--primary-700);margin-top:2px;">创建后仅展示一次完整 Key。建议为不同项目/环境创建独立 Key，并绑定模型权限与 IP 白名单。</div>
        </div>
      </div>
    </div>

    <!-- 筛选工具栏 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-input">
          <span class="search-icon">🔍</span>
          <input type="text" id="key-search" placeholder="搜索 Key 名称 / 前缀..." onkeydown="if(event.key==='Enter')renderKeys()">
        </div>
        <select class="form-select" id="key-status-filter" onchange="renderKeys()" style="width:130px;padding:8px 32px 8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:var(--text-sm);cursor:pointer;outline:none;">
          <option value="全部">状态：全部</option>
          <option value="启用">启用</option>
          <option value="禁用">禁用</option>
        </select>
        <button class="btn btn-primary" onclick="renderKeys()">搜索</button>
      </div>
      <div class="toolbar-right">
        <span style="font-size:var(--text-sm);color:var(--text-muted);" id="key-count"></span>
      </div>
    </div>

    <!-- Key 列表 -->
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Key 名称</th>
            <th>前缀</th>
            <th>权限</th>
            <th>模型权限</th>
            <th>状态</th>
            <th>最近使用</th>
            <th style="text-align:right;">操作</th>
          </tr>
        </thead>
        <tbody id="keys-tbody"></tbody>
      </table>
    </div>

  </div>
</main>

<!-- ============ 新建 Key 弹窗 ============ -->
<div class="modal-overlay" id="create-modal">
  <div class="modal" style="max-width:520px;">
    <h3 class="modal-title">新建 API Key</h3>
    <p class="modal-desc">创建后完整 Key 仅展示一次，请立即复制保存。</p>
    <div class="form-group">
      <label class="form-label">Key 名称</label>
      <input class="form-input" id="new-key-name" placeholder="如：生产环境-主Key">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">权限范围</label>
        <select class="perm-select" id="new-key-perm">
          <option value="读写">读写（可调用全部接口）</option>
          <option value="只读">只读（仅查询类接口）</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">IP 白名单</label>
        <input class="form-input" id="new-key-ip" placeholder="如 114.92.118.0/24（留空不限制）">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">模型权限</label>
      <div class="create-model-grid" id="new-key-models"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeCreateModal()">取消</button>
      <button class="btn btn-primary" onclick="createKey()">创建 Key</button>
    </div>
  </div>
</div>

<!-- ============ 创建成功弹窗 ============ -->
<div class="modal-overlay" id="created-modal">
  <div class="modal" style="max-width:520px;">
    <h3 class="modal-title">🎉 Key 创建成功</h3>
    <p class="modal-desc">请复制并妥善保存以下完整 Key，关闭后将无法再次查看。</p>
    <div class="full-key-box" id="created-key-value"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="copyCreatedKey()">📋 复制</button>
      <button class="btn btn-primary" onclick="closeCreatedModal()">我已保存</button>
    </div>
  </div>
</div>

<script src="assets/js/common.js"></script>
<script>
/* ================================================================== */
/*  工具                                                              */
/* ================================================================== */
function findKey(id) {
  var keys = getEntData('keys') || [];
  return keys.find(function (k) { return k.id === id; }) || null;
}

function getFilteredKeys() {
  var kw = document.getElementById('key-search').value.trim().toLowerCase();
  var st = document.getElementById('key-status-filter').value;
  return (getEntData('keys') || []).filter(function (k) {
    var okKw = !kw || k.name.toLowerCase().indexOf(kw) > -1 || k.prefix.toLowerCase().indexOf(kw) > -1;
    var okSt = st === '全部' || k.status === st;
    return okKw && okSt;
  });
}

function modelChips(key) {
  var shown = key.models.slice(0, 3);
  var extra = key.models.length - shown.length;
  return shown.map(function (m) {
    return '<span class="model-chip-tag">' + getModelName(m) + '</span>';
  }).join('') + (extra > 0 ? '<span class="model-chip-tag more">+' + extra + '</span>' : '');
}

/* ================================================================== */
/*  渲染                                                              */
/* ================================================================== */
function renderKeys() {
  var rows = getFilteredKeys();
  var tbody = document.getElementById('keys-tbody');
  document.getElementById('key-count').textContent = '共 ' + rows.length + ' 个 Key';
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state" style="padding:var(--space-12) var(--space-4);">'
      + '<div class="empty-icon">🔑</div><div class="empty-title">还没有 API Key</div>'
      + '<div class="empty-text">创建第一个 Key 开始接入 PrismMesh 模型服务</div>'
      + '<button class="btn btn-primary" onclick="openCreateModal()">+ 新建 Key</button></div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function (k) {
    var permBadge = k.perm === '读写' ? 'badge-blue' : 'badge-gray';
    var stBadge = k.status === '启用' ? 'badge-green' : 'badge-gray';
    var toggleBtn = k.status === '启用'
      ? '<button class="btn btn-outline btn-sm" onclick="toggleKeyStatus(\'' + k.id + '\')">禁用</button>'
      : '<button class="btn btn-outline btn-sm" style="color:var(--success);" onclick="toggleKeyStatus(\'' + k.id + '\')">启用</button>';
    return '<tr>'
      + '<td><span class="key-detail-link" onclick="goTo(\'key-detail.html?id=' + k.id + '\')">' + k.name + '</span></td>'
      + '<td><span class="cell-mono">' + k.prefix + '</span></td>'
      + '<td><span class="badge ' + permBadge + '">' + k.perm + '</span></td>'
      + '<td><div class="model-chips">' + modelChips(k) + '</div></td>'
      + '<td><span class="badge ' + stBadge + '">' + k.status + '</span></td>'
      + '<td>' + k.last + '</td>'
      + '<td><div class="cell-actions">'
      +   '<button class="btn btn-ghost btn-sm" onclick="goTo(\'key-detail.html?id=' + k.id + '\')">明细</button>'
      +   '<button class="btn btn-ghost btn-sm" onclick="copyKeyPrefix(\'' + k.id + '\')">复制</button>'
      +   toggleBtn
      +   '<button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteKey(\'' + k.id + '\')">删除</button>'
      + '</div></td>'
      + '</tr>';
  }).join('');
}

/* ================================================================== */
/*  Key 操作                                                          */
/* ================================================================== */
function copyKeyPrefix(id) {
  var k = findKey(id);
  if (!k) return;
  copyToClipboard(k.prefix);
}

async function toggleKeyStatus(id) {
  var k = findKey(id);
  if (!k) return;
  var toDisable = k.status === '启用';
  var ok = await showConfirm(
    toDisable ? '禁用 Key' : '启用 Key',
    toDisable
      ? '确定要禁用「' + k.name + '」吗？禁用后使用该 Key 的请求将立即失败。'
      : '确定要重新启用「' + k.name + '」吗？启用后即可正常调用。'
  );
  if (!ok) return;
  var keys = getEntData('keys') || [];
  keys.forEach(function (x) { if (x.id === id) x.status = toDisable ? '禁用' : '启用'; });
  saveEntData('keys', keys);
  renderKeys();
  showToast('Key「' + k.name + '」已' + (toDisable ? '禁用' : '启用'), 'success');
}

async function deleteKey(id) {
  var k = findKey(id);
  if (!k) return;
  var ok = await showConfirm('删除 Key', '确定要删除「' + k.name + '」吗？删除后该 Key 立即失效，且不可恢复。');
  if (!ok) return;
  var keys = (getEntData('keys') || []).filter(function (x) { return x.id !== id; });
  saveEntData('keys', keys);
  renderKeys();
  showToast('Key「' + k.name + '」已删除', 'warning');
}

/* ================================================================== */
/*  新建 Key                                                          */
/* ================================================================== */
function openCreateModal() {
  document.getElementById('new-key-name').value = '';
  document.getElementById('new-key-perm').value = '读写';
  document.getElementById('new-key-ip').value = '';
  var grid = document.getElementById('new-key-models');
  grid.innerHTML = ENT_MODELS.map(function (m) {
    return '<label class="create-model-item">'
      + '<input type="checkbox" value="' + m.id + '" ' + (m.type === '对话' ? 'checked' : '') + '>'
      + '<span>' + m.name + '</span>'
      + '</label>';
  }).join('');
  document.querySelectorAll('#new-key-models .create-model-item').forEach(function (item) {
    var cb = item.querySelector('input');
    item.classList.toggle('checked', cb.checked);
    cb.addEventListener('change', function () { item.classList.toggle('checked', cb.checked); });
  });
  document.getElementById('create-modal').classList.add('show');
  setTimeout(function () { document.getElementById('new-key-name').focus(); }, 100);
}

function closeCreateModal() {
  document.getElementById('create-modal').classList.remove('show');
}

function createKey() {
  var name = document.getElementById('new-key-name').value.trim();
  if (!name) { showToast('请输入 Key 名称', 'warning'); return; }
  var models = [];
  document.querySelectorAll('#new-key-models input:checked').forEach(function (cb) { models.push(cb.value); });
  if (!models.length) { showToast('请至少选择一个模型权限', 'warning'); return; }
  var ip = document.getElementById('new-key-ip').value.trim();

  var newKey = {
    id: 'k_' + genId(),
    name: name,
    prefix: 'sk-ent-' + Math.random().toString(16).substr(2, 4) + '****',
    full: 'sk-ent-' + Math.random().toString(16).substr(2, 16) + Math.random().toString(16).substr(2, 16),
    perm: document.getElementById('new-key-perm').value,
    models: models,
    status: '启用',
    created: new Date().toISOString().slice(0, 10),
    last: '尚未使用',
    ip: ip ? ('白名单 1 条') : '未限制',
    owner: (getEntUser() || {}).name || '管理员'
  };
  var keys = getEntData('keys') || [];
  keys.unshift(newKey);
  saveEntData('keys', keys);

  // 用量表初始化
  var usage = getEntData('usage') || {};
  usage[newKey.id] = {};
  saveEntData('usage', usage);

  closeCreateModal();
  document.getElementById('created-key-value').textContent = newKey.full;
  document.getElementById('created-modal').classList.add('show');
  renderKeys();
}

function copyCreatedKey() {
  var v = document.getElementById('created-key-value').textContent;
  copyToClipboard(v);
}

function closeCreatedModal() {
  document.getElementById('created-modal').classList.remove('show');
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(function () {
    showToast('已复制到剪贴板', 'success');
  });
}

/* ================================================================== */
/*  初始化                                                            */
/* ================================================================== */
document.addEventListener('DOMContentLoaded', function () {
  requireEntLogin();
  var user = getEntUser();
  var org = getEntOrg();
  if (org) document.getElementById('ent-org-name').textContent = org.name;
  if (user) {
    document.getElementById('ent-user-name').textContent = user.name + '（' + user.role + '）';
    document.getElementById('ent-avatar').textContent = (org ? org.name.charAt(0) : 'E').toUpperCase();
  }
  // 从概览页 "新建 Key" 快捷入口自动打开弹窗
  if (location.search.indexOf('new=1') > -1) {
    openCreateModal();
    history.replaceState(null, '', location.pathname);
  }
  renderKeys();
});
</script>
</body>
</html>
