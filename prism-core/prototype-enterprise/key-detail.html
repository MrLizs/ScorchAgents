<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key 详情 - PrismCore 企业后台</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/admin.css">
<style>
  /* Key 详情页局部样式 */
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-sub); cursor: pointer; margin-bottom: var(--space-3); }
  .back-link:hover { color: var(--primary); }

  .key-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); margin-top: var(--space-4); }
  @media (min-width: 768px) { .key-meta { grid-template-columns: repeat(4, 1fr); } }
  .meta-item { padding: var(--space-3); background: var(--gray-50); border-radius: var(--radius); }
  .meta-item .meta-label { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 4px; }
  .meta-item .meta-value { font-size: var(--text-sm); font-weight: var(--font-weight-semibold); color: var(--text); word-break: break-all; }
  .meta-item .meta-value.mono { font-family: var(--font-mono); }

  /* 模型用量行 */
  .usage-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); }
  .usage-row:last-child { border-bottom: none; }
  .usage-row .u-model { width: 180px; flex-shrink: 0; font-weight: var(--font-weight-medium); font-size: var(--text-sm); }
  .usage-row .u-bar { flex: 1; }
  .usage-row .u-num { width: 130px; text-align: right; font-size: var(--text-sm); color: var(--text-sub); flex-shrink: 0; }

  /* 审计时间线 */
  .audit-list { margin-top: var(--space-3); }
  .audit-item { display: flex; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); }
  .audit-item:last-child { border-bottom: none; }
  .audit-item .a-time { width: 150px; flex-shrink: 0; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-sub); padding-top: 2px; }
  .audit-item .a-body { flex: 1; min-width: 0; }
  .audit-item .a-line1 { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .audit-item .a-line1 .a-model { font-weight: var(--font-weight-semibold); font-size: var(--text-sm); color: var(--text); }
  .audit-item .a-line2 { font-size: var(--text-xs); color: var(--text-muted); margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .audit-item .a-ico { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: var(--text-sm); }
  .audit-item .a-ico.ok { background: var(--success-50); }
  .audit-item .a-ico.fail { background: var(--danger-50); }

  .detail-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
  @media (min-width: 1024px) { .detail-grid { grid-template-columns: 1fr 1.4fr; } }
</style>
</head>
<body>

<!-- ============ 侧边栏 ============ -->
<aside class="admin-sidebar" id="ent-sidebar">
  <div class="sidebar-brand">
    <span class="logo-icon">E</span>
    <span class="brand-name"><span class="highlight">Prism</span>Core</span>
  </div>
  <div class="sidebar-nav">
    <div class="sidebar-section-label">总览</div>
    <button class="nav-item" data-page="overview.html" onclick="goTo('overview.html')"><span class="nav-icon">📊</span>企业概览</button>
    <div class="sidebar-section-label">管理</div>
    <button class="nav-item" data-page="keys.html" onclick="goTo('keys.html')"><span class="nav-icon">🔑</span>API Key 管理</button>
    <button class="nav-item" data-page="dialogues.html" onclick="goTo('dialogues.html')"><span class="nav-icon">💬</span>对话审计</button>
    <div class="sidebar-section-label">分析</div>
    <button class="nav-item" data-page="usage.html" onclick="goTo('usage.html')"><span class="nav-icon">📈</span>用量统计</button>
    <button class="nav-item" data-page="audit.html" onclick="goTo('audit.html')"><span class="nav-icon">🕐</span>调用审计</button>
    <div class="sidebar-section-label">企业</div>
    <button class="nav-item" data-page="members.html" onclick="goTo('members.html')"><span class="nav-icon">👥</span>成员管理</button>
    <button class="nav-item" data-page="settings.html" onclick="goTo('settings.html')"><span class="nav-icon">⚙️</span>企业设置</button>
  </div>
  <div class="sidebar-footer">
    <div class="admin-info">
      <span class="avatar" id="ent-avatar">E</span>
      <div>
        <div id="ent-org-name" style="font-weight:var(--font-weight-semibold);color:#fff;font-size:var(--text-sm);">企业名称</div>
        <div id="ent-user-name" style="font-size:var(--text-xs);color:rgba(255,255,255,0.5);">管理员</div>
      </div>
    </div>
    <button class="logout-btn" onclick="entLogout()">🚪 退出登录</button>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- ============ 顶栏 ============ -->
<header class="admin-header">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <h1 class="header-title">Key 详情</h1>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="goTo('../prototype-web/index.html')">🌐 用户端</button>
  </div>
</header>

<!-- ============ 内容区 ============ -->
<main class="admin-main">
  <div class="admin-content">

    <div class="back-link" onclick="goTo('keys.html')">← 返回 Key 列表</div>

    <!-- Key 信息卡 -->
    <div class="card">
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <span class="avatar" style="width:40px;height:40px;font-size:var(--text-md);" id="key-avatar">🔑</span>
          <div>
            <div style="display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;">
              <span class="card-title" id="key-name">-</span>
              <span class="badge badge-green" id="key-status">-</span>
              <span class="badge badge-blue" id="key-perm">-</span>
            </div>
            <div style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted);margin-top:4px;" id="key-prefix">-</div>
          </div>
        </div>
        <div>
          <button class="btn btn-outline btn-sm" onclick="goTo('audit.html?key=' + encodeURIComponent(currentKeyId))">查看审计</button>
          <button class="btn btn-primary btn-sm" onclick="copyKey()">📋 复制</button>
        </div>
      </div>
      <div class="key-meta">
        <div class="meta-item"><div class="meta-label">创建时间</div><div class="meta-value" id="key-created">-</div></div>
        <div class="meta-item"><div class="meta-label">最近使用</div><div class="meta-value" id="key-last">-</div></div>
        <div class="meta-item"><div class="meta-label">IP 白名单</div><div class="meta-value" id="key-ip">-</div></div>
        <div class="meta-item"><div class="meta-label">创建人</div><div class="meta-value" id="key-owner">-</div></div>
      </div>
      <div style="margin-top:var(--space-4);">
        <div class="form-label">模型权限</div>
        <div class="model-chips" id="key-models" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
      </div>
    </div>

    <!-- 统计 -->
    <div class="stat-grid" style="margin-top:var(--space-4);">
      <div class="stat-card">
        <div class="stat-accent" style="background:var(--primary);"></div>
        <span class="stat-icon">📡</span>
        <div class="stat-value" id="stat-calls">-</div>
        <div class="stat-label">累计调用次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-accent" style="background:var(--accent);"></div>
        <span class="stat-icon">⚡</span>
        <div class="stat-value" id="stat-tokens">-</div>
        <div class="stat-label">累计 Token</div>
      </div>
      <div class="stat-card">
        <div class="stat-accent" style="background:var(--warning);"></div>
        <span class="stat-icon">💰</span>
        <div class="stat-value" id="stat-cost">-</div>
        <div class="stat-label">累计费用</div>
      </div>
      <div class="stat-card">
        <div class="stat-accent" style="background:var(--success);"></div>
        <span class="stat-icon">✅</span>
        <div class="stat-value" id="stat-success">-</div>
        <div class="stat-label">调用成功率</div>
      </div>
    </div>

    <div class="detail-grid">
      <!-- 左：按模型统计 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">该 Key 调用了什么模型</div>
        </div>
        <div class="card-body">
          <div class="table-wrap" style="margin-bottom:var(--space-4);">
            <table class="data-table">
              <thead>
                <tr>
                  <th>模型</th>
                  <th style="text-align:right;">次数</th>
                  <th style="text-align:right;">Token</th>
                  <th style="text-align:right;">费用</th>
                </tr>
              </thead>
              <tbody id="model-usage-tbody"></tbody>
            </table>
          </div>
          <div id="model-usage-rows"></div>
        </div>
      </div>

      <!-- 右：调用时间线 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">该 Key 在什么时间做了什么</div>
          <button class="btn btn-ghost btn-sm" onclick="goTo('audit.html?key=' + encodeURIComponent(currentKeyId))">全部审计 →</button>
        </div>
        <div class="toolbar" style="margin-bottom:var(--space-2);">
          <select class="form-select" id="audit-status-filter" onchange="renderTimeline()" style="width:120px;padding:6px 32px 6px 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:var(--text-sm);cursor:pointer;outline:none;">
            <option value="全部">状态：全部</option>
            <option value="成功">成功</option>
            <option value="失败">失败</option>
          </select>
          <span style="font-size:var(--text-xs);color:var(--text-muted);" id="timeline-count"></span>
        </div>
        <div class="audit-list" id="timeline-list"></div>
      </div>
    </div>

    <!-- 对话审计 -->
    <div class="card" style="margin-top:var(--space-4);">
      <div class="card-header">
        <div class="card-title">💬 对话内容审计</div>
        <span style="font-size:var(--text-xs);color:var(--text-muted);">AI 自动分类项目与功能，标记异常使用</span>
      </div>
      <div class="toolbar" style="margin-bottom:var(--space-2);">
        <div class="toolbar-left">
          <select class="form-select" id="d-risk-filter" onchange="renderDialogueAudit()" style="width:130px;padding:6px 32px 6px 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:var(--text-sm);cursor:pointer;outline:none;">
            <option value="全部">风险：全部</option>
            <option value="safe">安全</option>
            <option value="suspicious">可疑</option>
            <option value="violation">违规</option>
          </select>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-ghost btn-sm" onclick="goTo('dialogues.html?key=' + encodeURIComponent(currentKeyId))">查看该 Key 全部对话 →</button>
        </div>
      </div>
      <div id="dialogue-audit-list"></div>
    </div>

  </div>
</main>

<script src="assets/js/common.js"></script>
<script>
/* ================================================================== */
/*  状态                                                              */
/* ================================================================== */
var currentKeyId = new URLSearchParams(location.search).get('id') || 'k_01';
var currentKey = null;

/* ================================================================== */
/*  渲染 Key 基本信息                                                 */
/* ================================================================== */
function renderKeyInfo() {
  var keys = getEntData('keys') || [];
  currentKey = keys.find(function (k) { return k.id === currentKeyId; });
  if (!currentKey) {
    showToast('未找到该 Key，已返回列表', 'warning');
    setTimeout(function () { goTo('keys.html'); }, 800);
    return;
  }
  document.getElementById('key-name').textContent = currentKey.name;
  document.getElementById('key-prefix').textContent = currentKey.prefix;
  document.getElementById('key-status').textContent = currentKey.status;
  document.getElementById('key-status').className = 'badge ' + (currentKey.status === '启用' ? 'badge-green' : 'badge-gray');
  document.getElementById('key-perm').textContent = currentKey.perm;
  document.getElementById('key-created').textContent = currentKey.created;
  document.getElementById('key-last').textContent = currentKey.last;
  document.getElementById('key-ip').textContent = currentKey.ip;
  document.getElementById('key-owner').textContent = currentKey.owner;
  document.getElementById('key-models').innerHTML = currentKey.models.map(function (m) {
    var mm = ENT_MODELS.find(function (x) { return x.id === m; });
    return '<span class="badge ' + (mm && mm.type === '对话' ? 'badge-blue' : 'badge-green') + '">' + getModelName(m) + '</span>';
  }).join('') || '<span class="badge badge-gray">未配置</span>';
}

/* ================================================================== */
/*  按模型统计                                                        */
/* ================================================================== */
function renderModelUsage() {
  var usage = getEntData('usage') || {};
  var u = usage[currentKeyId] || {};
  var models = Object.keys(u).map(function (mid) {
    return { id: mid, name: getModelName(mid), calls: u[mid].calls, tokens: u[mid].tokens, cost: u[mid].cost };
  }).sort(function (a, b) { return b.calls - a.calls; });

  var totalCalls = 0, totalTokens = 0, totalCost = 0;
  models.forEach(function (m) { totalCalls += m.calls; totalTokens += m.tokens; totalCost += m.cost; });

  document.getElementById('stat-calls').textContent = formatNumber(totalCalls);
  document.getElementById('stat-tokens').textContent = formatTokens(totalTokens);
  document.getElementById('stat-cost').textContent = formatCurrency(totalCost);

  // 成功率：从审计记录计算
  var audit = (getEntData('audit') || []).filter(function (a) { return a.keyId === currentKeyId; });
  var okCount = audit.filter(function (a) { return a.status === '成功'; }).length;
  document.getElementById('stat-success').textContent = audit.length ? Math.round(okCount / audit.length * 100) + '%' : '100%';

  // 表格
  var tbody = document.getElementById('model-usage-tbody');
  if (!models.length) {
    tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state" style="padding:var(--space-8) var(--space-4);">'
      + '<div class="empty-icon">📈</div><div class="empty-title">该 Key 暂无调用记录</div></div></td></tr>';
    return;
  }
  tbody.innerHTML = models.map(function (m) {
    return '<tr>'
      + '<td><span class="cell-mono" style="font-size:var(--text-base);">' + m.name + '</span></td>'
      + '<td style="text-align:right;">' + formatNumber(m.calls) + '</td>'
      + '<td style="text-align:right;">' + formatTokens(m.tokens) + '</td>'
      + '<td style="text-align:right;">' + formatCurrency(m.cost) + '</td>'
      + '</tr>';
  }).join('');

  // 占比条
  var rowsBox = document.getElementById('model-usage-rows');
  rowsBox.innerHTML = models.map(function (m) {
    var pct = totalCalls ? Math.round(m.calls / totalCalls * 100) : 0;
    return '<div class="usage-row">'
      + '<span class="u-model">' + m.name + '</span>'
      + '<div class="u-bar"><div class="progress"><div class="progress-bar" style="width:' + pct + '%;"></div></div></div>'
      + '<span class="u-num">' + formatNumber(m.calls) + ' 次 · ' + pct + '%</span>'
      + '</div>';
  }).join('');
}

/* ================================================================== */
/*  调用时间线（该 Key 何时做了什么）                                  */
/* ================================================================== */
function renderTimeline() {
  var st = document.getElementById('audit-status-filter').value;
  var audit = (getEntData('audit') || [])
    .filter(function (a) { return a.keyId === currentKeyId && (st === '全部' || a.status === st); })
    .sort(function (a, b) { return b.time < a.time ? -1 : 1; });

  var list = document.getElementById('timeline-list');
  document.getElementById('timeline-count').textContent = '共 ' + audit.length + ' 条';
  if (!audit.length) {
    list.innerHTML = '<div class="empty-state" style="padding:var(--space-8) var(--space-4);">'
      + '<div class="empty-icon">🕐</div><div class="empty-title">该 Key 暂无调用记录</div></div>';
    return;
  }
  list.innerHTML = audit.map(function (a) {
    var ok = a.status === '成功';
    return '<div class="audit-item">'
      + '<span class="a-ico ' + (ok ? 'ok' : 'fail') + '">' + (ok ? '✓' : '✕') + '</span>'
      + '<div class="a-time">' + a.time + '</div>'
      + '<div class="a-body">'
      +   '<div class="a-line1">'
      +     '<span class="a-model">' + getModelName(a.model) + '</span>'
      +     '<span class="badge ' + (ok ? 'badge-green' : 'badge-red') + '">' + a.status + '</span>'
      +     '<span class="badge badge-gray">' + a.action + '</span>'
      +   '</div>'
      +   '<div class="a-line2">'
      +     '<span>IP ' + a.ip + '</span>'
      +     '<span>' + a.tokens + ' tokens</span>'
      +     '<span>费用 ' + formatCurrency(a.cost) + '</span>'
      +     '<span>耗时 ' + a.latency + '</span>'
      +   '</div>'
      + '</div>'
      + '</div>';
  }).join('');
}

function copyKey() {
  if (!currentKey) return;
  copyToClipboard(currentKey.prefix);
}

/* ================================================================== */
/*  对话内容审计                                                      */
/* ================================================================== */
function renderDialogueAudit() {
  var rf = document.getElementById('d-risk-filter').value;
  var dialogues = (getEntData('dialogues') || [])
    .filter(function (d) { return d.keyId === currentKeyId && (rf === '全部' || d.auditRisk === rf); })
    .sort(function (a, b) { return b.time < a.time ? -1 : 1; });
  var box = document.getElementById('dialogue-audit-list');
  if (!dialogues.length) {
    box.innerHTML = '<div class="empty-state" style="padding:var(--space-6) var(--space-4);">'
      + '<div class="empty-icon">💬</div><div class="empty-title">该 Key 暂无对话审计记录</div></div>';
    return;
  }
  var riskLabel = { safe: '安全', suspicious: '可疑', violation: '违规' };
  box.innerHTML = dialogues.map(function (d) {
    var riskCls = 'risk-' + d.auditRisk;
    var project = d.adminProject || d.auditProject;
    var feature = d.adminFeature || d.auditFeature;
    var corrected = !!(d.adminProject || d.adminFeature);
    return '<div class="dialogue-row' + (d.flagged ? ' flagged' : '') + '">'
      + '<div class="dialogue-header">'
      +   '<div class="dh-left">'
      +     '<span class="cell-mono" style="font-size:var(--text-xs);">' + d.time + '</span>'
      +     '<span class="badge badge-gray">' + getModelName(d.model) + '</span>'
      +     '<span class="risk-badge ' + riskCls + '"><span class="flag-dot ' + d.auditRisk + '"></span>' + riskLabel[d.auditRisk] + '</span>'
      +     (corrected ? '<span class="badge badge-blue">已纠正</span>' : '')
      +     (d.flagged ? '<span class="badge badge-red">已告警</span>' : '')
      +   '</div>'
      +   '<div class="tag-pair"><span class="tag-proj">' + project + '</span><span>→</span><span class="tag-feat">' + feature + '</span></div>'
      + '</div>'
      + '<div class="dialogue-body">'
      +   '<div class="db-question"><strong>用户提问：</strong>' + d.userQuestion + '</div>'
      +   '<div class="db-preview"><strong>模型回复：</strong>' + (d.completionPreview || '（无输出）') + '</div>'
      +   '<div class="dialogue-meta">Token：' + formatTokens(d.tokens) + ' · 费用：' + formatCurrency(d.cost) + '</div>'
      +   (d.violationNote ? '<div style="margin-top:var(--space-2);color:var(--danger);font-size:var(--text-xs);">告警原因：' + d.violationNote + '</div>' : '')
      + '</div>'
      + '</div>';
  }).join('');
}

/* ================================================================== */
/*  初始化                                                            */
/* ================================================================== */
document.addEventListener('DOMContentLoaded', function () {
  requireEntLogin();
  var user = getEntUser();
  var org = getEntOrg();
  if (org) document.getElementById('ent-org-name').textContent = org.name;
  if (user) {
    document.getElementById('ent-user-name').textContent = user.name + '（' + user.role + '）';
    document.getElementById('ent-avatar').textContent = (org ? org.name.charAt(0) : 'E').toUpperCase();
  }
  renderKeyInfo();
  renderModelUsage();
  renderTimeline();
  renderDialogueAudit();
});
</script>
</body>
</html>
