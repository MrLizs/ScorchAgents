<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业概览 - PrismCore 企业后台</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/admin.css">
<style>
  /* 概览页局部样式 */
  .chart-bars { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding: var(--space-4) 0; }
  .chart-bars .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .chart-bars .bar { width: 60%; max-width: 34px; background: linear-gradient(180deg, var(--primary-400), var(--primary-600)); border-radius: var(--radius-sm) var(--radius-sm) 0 0; transition: height 0.5s ease; position: relative; }
  .chart-bars .bar.highlight { background: linear-gradient(180deg, var(--accent-500), var(--success)); }
  .chart-bars .bar-label { font-size: var(--text-xs); color: var(--text-muted); }
  .bar-tooltip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--gray-900); color: #fff; font-size: var(--text-xs); padding: 3px 8px; border-radius: var(--radius-sm); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--transition-fast); }
  .bar:hover .bar-tooltip { opacity: 1; }

  .overview-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
  @media (min-width: 1024px) { .overview-grid { grid-template-columns: 2fr 1fr; } }

  .trend-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .trend-toggle .tt-btn { padding: 5px 14px; font-size: var(--text-sm); border: none; background: var(--surface); color: var(--text-sub); cursor: pointer; }
  .trend-toggle .tt-btn.active { background: var(--primary-50); color: var(--primary); font-weight: var(--font-weight-semibold); }

  .mini-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); }
  .mini-row:last-child { border-bottom: none; }
  .mini-row .mini-ico { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: var(--text-md); flex-shrink: 0; background: var(--primary-50); }
  .mini-row .mini-info { flex: 1; min-width: 0; }
  .mini-row .mini-name { font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-row .mini-sub { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
  .mini-row .mini-val { text-align: right; font-size: var(--text-sm); font-weight: var(--font-weight-semibold); color: var(--text); white-space: nowrap; }

  .quick-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
  .qa-btn { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); cursor: pointer; transition: all var(--transition-fast); text-align: left; }
  .qa-btn:hover { border-color: var(--primary-300); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .qa-btn .qa-icon { width: 38px; height: 38px; border-radius: var(--radius); background: var(--primary-50); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: var(--text-lg); flex-shrink: 0; }
  .qa-btn .qa-text b { display: block; font-size: var(--text-sm); color: var(--text); }
  .qa-btn .qa-text span { font-size: var(--text-xs); color: var(--text-muted); }
</style>
</head>
<body>

<!-- ============ 侧边栏 ============ -->
<aside class="admin-sidebar" id="ent-sidebar">
  <div class="sidebar-brand">
    <span class="logo-icon">E</span>
    <span class="brand-name"><span class="highlight">Prism</span>Core</span>
  </div>
  <div class="sidebar-nav">
    <div class="sidebar-section-label">总览</div>
    <button class="nav-item" data-page="overview.html" onclick="goTo('overview.html')"><span class="nav-icon">📊</span>企业概览</button>
    <div class="sidebar-section-label">管理</div>
    <button class="nav-item" data-page="keys.html" onclick="goTo('keys.html')"><span class="nav-icon">🔑</span>API Key 管理</button>
    <button class="nav-item" data-page="dialogues.html" onclick="goTo('dialogues.html')"><span class="nav-icon">💬</span>对话审计</button>
    <div class="sidebar-section-label">分析</div>
    <button class="nav-item" data-page="usage.html" onclick="goTo('usage.html')"><span class="nav-icon">📈</span>用量统计</button>
    <button class="nav-item" data-page="audit.html" onclick="goTo('audit.html')"><span class="nav-icon">🕐</span>调用审计</button>
    <div class="sidebar-section-label">企业</div>
    <button class="nav-item" data-page="members.html" onclick="goTo('members.html')"><span class="nav-icon">👥</span>成员管理</button>
    <button class="nav-item" data-page="settings.html" onclick="goTo('settings.html')"><span class="nav-icon">⚙️</span>企业设置</button>
  </div>
  <div class="sidebar-footer">
    <div class="admin-info">
      <span class="avatar" id="ent-avatar">E</span>
      <div>
        <div id="ent-org-name" style="font-weight:var(--font-weight-semibold);color:#fff;font-size:var(--text-sm);">企业名称</div>
        <div id="ent-user-name" style="font-size:var(--text-xs);color:rgba(255,255,255,0.5);">管理员</div>
      </div>
    </div>
    <button class="logout-btn" onclick="entLogout()">🚪 退出登录</button>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- ============ 顶栏 ============ -->
<header class="admin-header">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <h1 class="header-title">企业概览</h1>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="goTo('../prototype-web/index.html')">🌐 用户端</button>
  </div>
</header>

<!-- ============ 内容区 ============ -->
<main class="admin-main">
  <div class="admin-content">

    <div class="page-header">
      <div>
        <h2 class="page-title" id="page-welcome">企业概览</h2>
        <p class="page-subtitle">企业 API Key 使用情况总览</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" onclick="goTo('audit.html')">🕐 查看审计</button>
        <button class="btn btn-primary" onclick="goTo('keys.html?new=1')">+ 新建 Key</button>
      </div>
    </div>

    <!-- 数据统计 -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-accent" style="background:var(--success);"></div>
        <span class="stat-icon">🔑</span>
        <div class="stat-value" id="stat-keys">-</div>
        <div class="stat-label">有效 API Key</div>
        <span class="stat-change up">↑ 1 本月新增</span>
      </div>
      <div class="stat-card">
        <div class="stat-accent" style="background:var(--primary);"></div>
        <span class="stat-icon">📡</span>
        <div class="stat-value" id="stat-calls">-</div>
        <div class="stat-label">今日调用次数</div>
        <span class="stat-change up">↑ 12.6% 较昨日</span>
      </div>
      <div class="stat-card">
        <div class="stat-accent" style="background:var(--accent);"></div>
        <span class="stat-icon">⚡</span>
        <div class="stat-value" id="stat-tokens">-</div>
        <div class="stat-label">本月 Token 消耗</div>
        <span class="stat-change up">↑ 8.2% 较上月</span>
      </div>
      <div class="stat-card">
        <div class="stat-accent" style="background:var(--warning);"></div>
        <span class="stat-icon">💰</span>
        <div class="stat-value" id="stat-balance">-</div>
        <div class="stat-label">账户余额</div>
        <span class="stat-change down">↓ 预计可用 12 天</span>
      </div>
    </div>

    <!-- 快捷操作 -->
    <div class="quick-actions" style="margin-bottom:var(--space-6);">
      <button class="qa-btn" onclick="goTo('keys.html?new=1')">
        <span class="qa-icon">🔑</span>
        <span class="qa-text"><b>创建 API Key</b><span>按项目/环境隔离密钥</span></span>
      </button>
      <button class="qa-btn" onclick="goTo('usage.html')">
        <span class="qa-icon">📈</span>
        <span class="qa-text"><b>用量统计报表</b><span>按模型 / Key 分析成本</span></span>
      </button>
      <button class="qa-btn" onclick="goTo('audit.html')">
        <span class="qa-icon">🕐</span>
        <span class="qa-text"><b>调用审计日志</b><span>查看 Key 何时做了什么</span></span>
      </button>
      <button class="qa-btn" onclick="goTo('members.html')">
        <span class="qa-icon">👥</span>
        <span class="qa-text"><b>成员管理</b><span>分配子账号与权限</span></span>
      </button>
    </div>

    <div class="overview-grid">
      <!-- 左列：趋势 + Top 模型 -->
      <div>
        <div class="card">
          <div class="card-header">
            <div class="card-title">调用趋势</div>
            <div class="trend-toggle" id="trend-toggle">
              <button class="tt-btn active" data-range="7d" onclick="switchTrend('7d', this)">近 7 天</button>
              <button class="tt-btn" data-range="30d" onclick="switchTrend('30d', this)">近 30 天</button>
            </div>
          </div>
          <div class="chart-bars" id="trend-bars"></div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">Top 模型用量</div>
            <button class="btn btn-ghost btn-sm" onclick="goTo('usage.html')">查看全部 →</button>
          </div>
          <div class="table-wrap" style="margin-bottom:0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>模型</th>
                  <th>类型</th>
                  <th style="text-align:right;">调用次数</th>
                  <th style="text-align:right;">Token</th>
                  <th style="text-align:right;">费用</th>
                </tr>
              </thead>
              <tbody id="top-models-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 右列：最近活动 + 各 Key 速览 -->
      <div>
        <div class="card">
          <div class="card-header">
            <div class="card-title">各 Key 用量速览</div>
            <button class="btn btn-ghost btn-sm" onclick="goTo('keys.html')">管理 →</button>
          </div>
          <div id="key-snapshots"></div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">最近 Key 活动</div>
            <button class="btn btn-ghost btn-sm" onclick="goTo('audit.html')">全部 →</button>
          </div>
          <div id="recent-activity"></div>
        </div>

        <!-- 对话审计异常摘要 -->
        <div class="card" id="anomaly-card">
          <div class="card-header">
            <div class="card-title">⚡ 使用异常摘要</div>
            <button class="btn btn-ghost btn-sm" onclick="goTo('dialogues.html')">对话审计 →</button>
          </div>
          <div id="anomaly-summary"></div>
        </div>
      </div>
    </div>

  </div>
</main>

<script src="assets/js/common.js"></script>
<script>
/* ================================================================== */
/*  概览页数据渲染                                                    */
/* ================================================================== */
function aggregateByModel() {
  var usage = getEntData('usage') || {};
  var agg = {};
  Object.keys(usage).forEach(function (kid) {
    Object.keys(usage[kid]).forEach(function (mid) {
      var u = usage[kid][mid];
      if (!agg[mid]) agg[mid] = { calls: 0, tokens: 0, cost: 0 };
      agg[mid].calls += u.calls;
      agg[mid].tokens += u.tokens;
      agg[mid].cost += u.cost;
    });
  });
  return Object.keys(agg).map(function (mid) {
    return { model: mid, name: getModelName(mid), calls: agg[mid].calls, tokens: agg[mid].tokens, cost: agg[mid].cost };
  }).sort(function (a, b) { return b.calls - a.calls; });
}

function renderStats() {
  var keys = getEntData('keys') || [];
  var usage = getEntData('usage') || {};
  var activeKeys = keys.filter(function (k) { return k.status === '启用'; }).length;
  var totalCalls = 0, totalTokens = 0, totalCost = 0;
  Object.keys(usage).forEach(function (kid) {
    Object.keys(usage[kid]).forEach(function (mid) {
      totalCalls += usage[kid][mid].calls;
      totalTokens += usage[kid][mid].tokens;
      totalCost += usage[kid][mid].cost;
    });
  });
  var org = getEntOrg() || { balance: 1286.40 };
  document.getElementById('stat-keys').textContent = formatNumber(activeKeys);
  document.getElementById('stat-calls').textContent = formatNumber(totalCalls);
  document.getElementById('stat-tokens').textContent = formatTokens(totalTokens);
  document.getElementById('stat-balance').textContent = formatCurrency(org.balance);
}

function renderTopModels() {
  var rows = aggregateByModel();
  var tbody = document.getElementById('top-models-tbody');
  tbody.innerHTML = rows.map(function (r) {
    var type = ENT_MODELS.find(function (m) { return m.id === r.model; });
    return '<tr>'
      + '<td><span class="cell-mono" style="font-size:var(--text-base);">' + r.name + '</span></td>'
      + '<td><span class="badge ' + (type && type.type === '对话' ? 'badge-blue' : 'badge-green') + '">' + (type ? type.type : '-') + '</span></td>'
      + '<td style="text-align:right;">' + formatNumber(r.calls) + '</td>'
      + '<td style="text-align:right;">' + formatTokens(r.tokens) + '</td>'
      + '<td style="text-align:right;">' + formatCurrency(r.cost) + '</td>'
      + '</tr>';
  }).join('');
}

function renderKeySnapshots() {
  var keys = getEntData('keys') || [];
  var usage = getEntData('usage') || {};
  var box = document.getElementById('key-snapshots');
  box.innerHTML = keys.map(function (k) {
    var u = usage[k.id] || {};
    var calls = 0, tokens = 0;
    Object.keys(u).forEach(function (mid) { calls += u[mid].calls; tokens += u[mid].tokens; });
    var badge = k.status === '启用' ? 'badge-green' : 'badge-gray';
    return '<div class="mini-row" style="cursor:pointer;" onclick="goTo(\'key-detail.html?id=' + k.id + '\')">'
      + '<span class="mini-ico">🔑</span>'
      + '<div class="mini-info">'
      +   '<div class="mini-name">' + k.name + ' <span class="badge ' + badge + '" style="margin-left:4px;">' + k.status + '</span></div>'
      +   '<div class="mini-sub">' + k.prefix + ' · ' + formatNumber(calls) + ' 次</div>'
      + '</div>'
      + '<div class="mini-val">' + formatTokens(tokens) + ' <span style="font-size:var(--text-xs);color:var(--text-muted);">tokens</span></div>'
      + '</div>';
  }).join('');
}

function renderRecentActivity() {
  var audit = getEntData('audit') || [];
  var keys = getEntData('keys') || [];
  var keyName = function (kid) {
    var k = keys.find(function (x) { return x.id === kid; });
    return k ? k.name : kid;
  };
  var box = document.getElementById('recent-activity');
  if (!audit.length) {
    box.innerHTML = '<div class="empty-state" style="padding:var(--space-8) var(--space-4);"><div class="empty-icon">🕐</div><div class="empty-title">暂无调用记录</div></div>';
    return;
  }
  box.innerHTML = audit.slice(0, 6).map(function (a) {
    var stBadge = a.status === '成功' ? 'badge-green' : 'badge-red';
    return '<div class="mini-row">'
      + '<span class="mini-ico">' + (a.status === '成功' ? '✅' : '❌') + '</span>'
      + '<div class="mini-info">'
      +   '<div class="mini-name">' + keyName(a.keyId) + ' → ' + getModelName(a.model) + '</div>'
      +   '<div class="mini-sub">' + a.time + ' · ' + formatTokens(a.tokens) + ' tokens · ' + a.ip + '</div>'
      + '</div>'
      + '<div class="mini-val"><span class="badge ' + stBadge + '">' + a.status + '</span></div>'
      + '</div>';
  }).join('');
}

/* ================================================================== */
/*  调用趋势（CSS 柱状图）                                             */
/* ================================================================== */
var TREND_7D = [3200, 4200, 3800, 5100, 4700, 6200, 5800];
var TREND_30D = [9200, 10500, 9800, 11800, 11200, 12600, 13400, 12200, 13800, 14500, 13100, 12800, 14200, 15600, 14800, 16100, 15400, 16800, 17500, 16200, 17900, 18600, 17200, 18100, 19300, 18700, 19800, 20500, 19700, 21400];

function renderTrend(data, labels) {
  var max = Math.max.apply(null, data);
  var box = document.getElementById('trend-bars');
  box.innerHTML = data.map(function (v, i) {
    var h = Math.round((v / max) * 140);
    return '<div class="bar-col">'
      + '<div class="bar" style="height:' + h + 'px;">'
      +   '<span class="bar-tooltip">' + formatNumber(v) + ' 次</span>'
      + '</div>'
      + '<span class="bar-label">' + labels[i] + '</span>'
      + '</div>';
  }).join('');
}

function switchTrend(range, btn) {
  document.querySelectorAll('#trend-toggle .tt-btn').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  if (range === '7d') {
    renderTrend(TREND_7D, ['周一', '周二', '周三', '周四', '周五', '周六', '周日']);
  } else {
    var labels = [];
    for (var i = 1; i <= 30; i++) labels.push(i + '日');
    renderTrend(TREND_30D, labels);
  }
}

/* ================================================================== */
/*  对话审计异常摘要                                                   */
/* ================================================================== */
function renderAnomalySummary() {
  var as = auditStats();
  var keys = getEntData('keys') || [];
  var box = document.getElementById('anomaly-summary');
  var suspicious = (getEntData('dialogues') || []).filter(function (d) { return d.auditRisk === 'suspicious' || d.auditRisk === 'violation' || d.flagged; });
  if (!suspicious.length) {
    box.innerHTML = '<div class="empty-state" style="padding:var(--space-6) var(--space-4);">'
      + '<div class="empty-icon">✅</div><div class="empty-title">未发现异常使用</div>'
      + '<div class="empty-text">所有 Key 对话使用均符合申报用途</div></div>';
    return;
  }
  // Group by key
  var byKey = {};
  suspicious.forEach(function (d) {
    if (!byKey[d.keyId]) byKey[d.keyId] = { suspicious: 0, violation: 0, flagged: 0, projects: {} };
    byKey[d.keyId][d.auditRisk] = (byKey[d.keyId][d.auditRisk] || 0) + 1;
    if (d.flagged) byKey[d.keyId].flagged++;
    var p = d.adminProject || d.auditProject;
    byKey[d.keyId].projects[p] = (byKey[d.keyId].projects[p] || 0) + 1;
  });
  box.innerHTML = Object.keys(byKey).map(function (kid) {
    var s = byKey[kid];
    var k = keys.find(function (x) { return x.id === kid; }) || {};
    var topProjects = Object.keys(s.projects).sort(function (a, b) { return s.projects[b] - s.projects[a]; }).slice(0, 2);
    var badgeHtml = [];
    if (s.violation) badgeHtml.push('<span class="badge badge-red">' + s.violation + ' 违规</span>');
    if (s.suspicious) badgeHtml.push('<span class="badge badge-yellow">' + s.suspicious + ' 可疑</span>');
    return '<div class="mini-row" style="cursor:pointer;" onclick="goTo(\'dialogues.html?key=' + kid + '\')">'
      + '<span class="mini-ico" style="background:' + (s.violation ? 'var(--danger-50)' : 'var(--warning-50)') + ';">' + (s.violation ? '🚫' : '⚠️') + '</span>'
      + '<div class="mini-info">'
      +   '<div class="mini-name">' + (k.name || kid) + ' ' + badgeHtml.join(' ') + '</div>'
      +   '<div class="mini-sub">偏离用途：' + topProjects.join('、') + '</div>'
      + '</div>'
      + '<div class="mini-val"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();goTo(\'key-detail.html?id=' + kid + '\')">查看 →</button></div>'
      + '</div>';
  }).join('');
}

/* ================================================================== */
/*  初始化                                                            */
/* ================================================================== */
document.addEventListener('DOMContentLoaded', function () {
  requireEntLogin();
  var user = getEntUser();
  var org = getEntOrg();
  if (org) {
    document.getElementById('ent-org-name').textContent = org.name;
    document.getElementById('page-welcome').textContent = org.name + ' · 企业概览';
  }
  if (user) {
    document.getElementById('ent-user-name').textContent = user.name + '（' + user.role + '）';
    document.getElementById('ent-avatar').textContent = (org ? org.name.charAt(0) : 'E').toUpperCase();
  }
  renderStats();
  renderTopModels();
  renderKeySnapshots();
  renderRecentActivity();
  renderTrend(TREND_7D, ['周一', '周二', '周三', '周四', '周五', '周六', '周日']);
  renderAnomalySummary();
});
</script>
</body>
</html>
